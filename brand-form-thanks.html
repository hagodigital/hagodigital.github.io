<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Got it — HagoDigital</title>
</head>
<body>
<style>
  :root{--navy:#000A18;--cream:#F8F5E6;--lime:#CEFF00;--grey:#696D71}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy);color:#C9C4B4;
    font:17px/1.62 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:640px;margin:0 auto;padding:18vh 24px 24px}
  .k{display:inline-flex;align-items:center;gap:10px;font-size:.75rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
  .k::before{content:"";width:26px;height:3px;background:var(--lime)}
  h1{font-family:Manrope,system-ui,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.1;
    color:var(--cream);font-size:clamp(1.9rem,5vw,2.7rem);margin:16px 0 20px;text-wrap:balance}
  p{margin:0 0 14px;max-width:52ch}
  b{color:var(--cream);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:9px;margin-top:12px;padding:14px 22px;
    border-radius:6px;background:var(--lime);color:var(--navy);text-decoration:none;
    font-weight:600;font-size:1rem}
  .btn:focus-visible{outline:3px solid #6E9BFF;outline-offset:3px}
  .quiet{color:var(--grey);font-size:.95rem;margin-top:18px}
</style>
<main>
  <span class="k">Sent</span>
  <h1>Got it. Your answers are with me.</h1>
  <p>I read them properly, then I write to you with a time for the call. Nothing to book and
     nothing to chase — the call happens either way, and how much you filled in changes what
     we spend it on, not whether we have it.</p>
  <div id="next"></div>
</main>
<script>
/* The call ALWAYS happens - the form prepares it, it never replaces it (2026-08-11,
   reversing the conditional-call design of 2026-08-10). So the counts carried on the
   redirect do not decide WHETHER to book, only what the call will be spent on: what
   was left open gets done together, and a form that came back full buys a call spent
   on direction instead of dictation.

   NO BOOKING LINK HERE (JP, 2026-09-01). It used to end on a calendar button. JP
   reads the brief first and sends the time himself, so a client cannot book against
   a brief he has not read yet. This is the one page on the domain whose primary
   action is NOT the calendar, and it is deliberate: the reader is already a client,
   not someone being acquired.

   The keepsake copy is offered HERE rather than beside the send button, because a
   save button standing next to the only action that matters is a rival to it. Once
   the answers are actually delivered it is a receipt, and it competes with nothing.
   It is read from the same localStorage the form saves into - same origin, so the
   brief at /brief/<route>/ and this page can both see it. Absent is normal: a
   different device, a cleared browser, or a client who tapped through from a link.
   Then the block simply does not render. */
(function(){
  var p = new URLSearchParams(location.search);
  var ask = parseInt(p.get("ask") || "0", 10) || 0;
  var blank = parseInt(p.get("blank") || "0", 10) || 0;
  var thing = function(n, one, many){ return n + " " + (n === 1 ? one : many); };
  var open = [];
  if (ask) open.push("flagged " + thing(ask, "question", "questions") + " for the call");
  if (blank) open.push("left " + thing(blank, "section", "sections") + " blank");

  var lead = open.length
    ? "You " + open.join(" and ") + ". We do " + (ask + blank === 1 ? "it" : "those") +
      " together — no homework, and nothing you have to go away and work out on your own."
    : "You answered the lot, which means the call is not spent taking dictation. " +
      "I come with proposals and we decide between them.";

  /* ONE thanks page serves BOTH routes, and build.py rewrites the form's storage
     key per route - hago-form-strengthen or hago-form-create - so a single literal
     here can only ever match half the clients. It matched NEITHER at first: the
     source key is hago-brand-form-v2 and that name never survives the build. Caught
     by driving the real page in a browser; nothing static would have shown it,
     because a key that never matches renders no button and throws no error. */
  var saved = "";
  try {
    saved = localStorage.getItem("hago-form-strengthen-sent")
         || localStorage.getItem("hago-form-create-sent") || "";
  } catch(e){}

  document.getElementById("next").innerHTML =
    "<p>" + lead + "</p>" +
    (saved ? '<p><button type="button" class="btn" id="keep">Save a copy for yourself</button></p>' : "") +
    '<p class="quiet">Watch your inbox — I will write to you with a time.</p>';

  var keep = document.getElementById("keep");
  if (keep) keep.addEventListener("click", function(){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([saved], { type: "text/plain" }));
    a.download = "my-answers.txt";
    document.body.appendChild(a); a.click();
    keep.textContent = "Saved";
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
})();
</script>

</body>
</html>
