<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Got it — HagoDigital</title>
</head>
<body>
<style>
  @font-face{font-family:'Clash Display';font-style:normal;font-weight:200 700;font-display:swap;src:url(assets/fonts/clash-display-var.woff2) format('woff2')}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/instrument-400.woff2) format('woff2')}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/instrument-600.woff2) format('woff2')}
  :root{--navy:#000A18;--cream:#F8F5E6;--lime:#CEFF00;--grey:#696D71}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy);color:#C9C4B4;
    font:17px/1.62 'Instrument Sans',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:640px;margin:0 auto;padding:18vh 24px 24px}
  .k{display:inline-flex;align-items:center;gap:10px;font-size:.75rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
  .k::before{content:"";width:26px;height:3px;background:var(--lime)}
  h1{font-family:'Clash Display',system-ui,sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.1;
    color:var(--cream);font-size:clamp(1.9rem,5vw,2.7rem);margin:16px 0 20px;text-wrap:balance}
  p{margin:0 0 14px;max-width:52ch}
  b{color:var(--cream);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:9px;margin-top:12px;padding:14px 22px;
    border-radius:6px;background:var(--lime);color:var(--navy);text-decoration:none;
    font-weight:600;font-size:1rem}
  .btn:focus-visible{outline:3px solid #6E9BFF;outline-offset:3px}
  /* --cream-mute, not --grey: this page's ground is navy, where grey measures
     3.81:1 and fails AA. Same defect as .proc-step, found the same way. */
  .quiet{color:var(--cream-mute);font-size:.95rem;margin-top:18px}
</style>
<main>
  <span class="k">Sent</span>
  <h1>Got it — now book the call</h1>
  <p>Your answers are with me and I read them properly before we talk. The call is the next
     step either way — how much you filled in changes what we spend it on, not whether we
     have it.</p>
  <div id="next"></div>
</main>
<script>
/* The call ALWAYS happens - the form prepares it, it never replaces it (2026-08-11,
   reversing the conditional-call design of 2026-08-10). So the counts carried on the
   redirect do not decide WHETHER to book, only what the call will be spent on: what
   was left open gets done together, and a form that came back full buys a call spent
   on direction instead of dictation. One button either way, same prominence. */
(function(){
  var BOOK = "https://calendar.app.google/d1jgYiEUs3yoh3Wr6";
  var p = new URLSearchParams(location.search);
  var ask = parseInt(p.get("ask") || "0", 10) || 0;
  var blank = parseInt(p.get("blank") || "0", 10) || 0;
  var thing = function(n, one, many){ return n + " " + (n === 1 ? one : many); };
  var open = [];
  if (ask) open.push("flagged " + thing(ask, "question", "questions") + " for the call");
  if (blank) open.push("left " + thing(blank, "section", "sections") + " blank");

  var lead = open.length
    ? "You " + open.join(" and ") + ". We do " + (ask + blank === 1 ? "it" : "those") +
      " together — no homework, and nothing you have to go away and work out on your own."
    : "You answered the lot, which means the call is not spent taking dictation. " +
      "I come with proposals and we decide between them.";

  document.getElementById("next").innerHTML =
    "<p>" + lead + "</p>" +
    '<p><a class="btn" href="' + BOOK + '" target="_blank" rel="noopener">Book the call</a></p>' +
    '<p class="quiet">Pick whichever slot suits. If none of them do, reply to my email and ' +
    'we will find one.</p>';
})();
</script>

</body>
</html>
