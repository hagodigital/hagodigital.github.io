<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <!-- Light-ground lockup. Navy structure, blue accent.
       KNOWN DEFECT: the wordmark is live <text>, not outlines. It is set in
       Inter (which every page already loads) rather than Manrope (which no
       page loads and which silently fell back to Arial). That makes it render
       correctly here, but it must still be outlined before this file is handed
       to any third party. No vectoriser on the build machine. -->
  <g transform="translate(36,80) scale(0.95)">
    <g transform="translate(12,0)">
      <!-- H stem and crossbar -->
      <path fill="#000A18" d="M24 24H68V99H151V141H68V216H24V24Z"/>
      <!-- D outer form -->
      <path fill="#000A18" fill-rule="evenodd" d="M151 24H195C255 24 296 64 296 120C296 176 255 216 195 216H151V174H195C229 174 251 151 251 120C251 89 229 66 195 66H151V24Z"/>
      <!-- Structural cutout — matches the light ground so the accent reads clear -->
      <path fill="#F8F5E6" d="M111 216V156L172 95V67L211 106V147L193 129L154 168V216H111Z"/>
      <!-- Accent -->
      <path fill="#2365DE" d="M126 216V164L182 108V84L204 106V130L193 119L145 167V216H126Z"/>
    </g>
  </g>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="165" letter-spacing="-5">
    <text x="365" y="255" fill="#000A18">Hago</text>
    <text x="770" y="255" fill="#2365DE">Digital</text>
  </g>
</svg>
